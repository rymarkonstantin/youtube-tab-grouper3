<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Tab Grouper</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main>
      <h1>YouTube Tab Grouper</h1>
      <p id="status" aria-live="polite">Checking YouTube tabs…</p>
      <p id="provider-status" aria-live="polite"></p>
      <progress id="progress" value="0" max="1" hidden></progress>
      <ul id="summary" aria-label="Grouping summary"></ul>
      <div class="actions">
        <button id="prepare" type="button" hidden>Prepare AI</button>
        <button id="cancel" type="button" hidden>Cancel</button>
        <button id="run-again" type="button" hidden>Run again</button>
        <button id="edit" type="button">Edit categories</button>
        <button id="copy-diagnostics" type="button" hidden>Copy diagnostics</button>
      </div>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>

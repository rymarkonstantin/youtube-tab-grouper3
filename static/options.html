<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Tab Grouper settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Grouping categories</h1>
      <p>Categories describe subject matter semantically. Rule order breaks equal topical matches. Managed groups use the reserved <code>YT · </code> prefix.</p>
      <div id="rules"></div>
      <button id="add" type="button">Add category</button>
      <button id="save" type="button">Save</button>
      <button id="restore" type="button">Restore defaults</button>
    <button id="clear-cache" type="button">Clear classification cache</button>
    <p id="status" aria-live="polite"></p>
    <ul id="validation-issues" aria-live="polite"></ul>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
